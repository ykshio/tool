<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字数カウンター</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>文字数カウンター 📏</h1>
        <p class="lead">テキスト全体の文字数と、行ごとの文字数をリアルタイムにカウントします。</p>

        <section class="input-section">
            <div class="toolbar">
                <label class="toggle-option">
                    <input type="checkbox" id="exclude-spaces">
                    <span>行ごとのカウントで空白（スペース）を除く</span>
                </label>
                <div class="toolbar-actions">
                    <button type="button" id="clear-btn">クリア</button>
                </div>
            </div>
            <textarea id="text-input" rows="10" placeholder="ここにテキストを入力または貼り付けてください..."></textarea>
        </section>

        <section class="stats-grid" aria-label="全体の集計">
            <div class="stat-card primary">
                <span class="stat-label">文字数（改行除く）</span>
                <span class="stat-value" id="total-no-newline">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">空白・改行除く</span>
                <span class="stat-value" id="total-no-space">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">文字数（改行含む）</span>
                <span class="stat-value" id="total-with-newline">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">行数（空行除く）</span>
                <span class="stat-value"><span id="line-count">0</span> <small>(<span id="non-empty-line-count">0</span>)</small></span>
            </div>
        </section>

        <section class="lines-section">
            <div class="lines-header">
                <h2>行ごとの文字数</h2>
                <span class="lines-summary" id="lines-summary">最大: 0文字 / 平均: 0文字</span>
            </div>
            <div class="lines-list" id="lines-list">
                <div class="empty-state">テキストを入力すると、ここに行ごとの文字数が表示されます。</div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
